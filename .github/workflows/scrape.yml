name: Update Results (manual fallback)

# Superseded by the Claude update routine (docs/agents/update-routine.md),
# which also reads Five K Sport in a browser, runs QAQC and publishes the
# postseason predictions. The schedule is off; a manual run still works as a
# fallback. Its commit triggers the GitHub Pages deploy (deploy-pages.yml).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Configure Git for large files
        run: |
          git config --global http.postBuffer 524288000
          git config --global core.compression 0

      - name: Run Scraper and Update Data
        run: |
          echo "Starting scraper (JSON-only)..."
          python3 backend/run_update.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Commit and Push Data Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated backend rescrape and team-data update [skip ci]"
          file_pattern: |
            ui/public/data/teams
            ui/public/data/manifest.json
            ui/public/data/athletes.json.gz
            ui/public/data/xc_courses.json.gz
            ui/public/data/xc_postseason
            ui/public/data/meet_links.json.gz
            backend/web_url_mapping.json
            backend/data/scrape_state.json
