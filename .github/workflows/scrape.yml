name: Update Results and Deploy

on:
  schedule:
    - cron: '0 11 * * 1' # Mondays at 11:00 UTC (6am EST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Configure Git for large files
        run: |
          git config --global http.postBuffer 524288000
          git config --global core.compression 0

      - name: Run Scraper and Update Data
        run: |
          echo "Starting scraper (JSON-only)..."
          python3 backend/run_update.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Commit and Push Data Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated backend rescrape and team-data update [skip ci]"
          file_pattern: |
            ui/public/data/teams
            ui/public/data/manifest.json
            ui/public/data/athletes.json.gz
            ui/public/data/xc_courses.json.gz
            backend/data/scrape_state.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is missing. Please add it to your GitHub Secrets."
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::VERCEL_ORG_ID or VERCEL_PROJECT_ID is missing from secrets. Checking vars..."
          fi
          
          # --archive=tgz is REQUIRED: the store is ~14.7k chunk files and Vercel's
          # raw upload path caps at 5,000 files/day ("api-upload-free").
          echo "Deploying to Vercel..."
          npx vercel --prod --yes --archive=tgz --token=$VERCEL_TOKEN
