name: Deploy site (GitHub Pages)

# The site is the static Vite app in ui/ (its data lives in ui/public/data).
# Every push to main that touches ui/ rebuilds and publishes it, so updating
# the site is just a push: the Claude update routine
# (docs/agents/update-routine.md) commits new data and pushes.

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - '.github/workflows/deploy-pages.yml'
  # the manual scrape fallback commits with the Actions token, which does not
  # trigger push workflows; deploy when it finishes instead
  workflow_run:
    workflows: ['Update Results (manual fallback)']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site only
        uses: actions/checkout@v4
        with:
          # the pipeline's archives (backend/data, ~1 GB) aren't needed to build
          sparse-checkout: ui

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Build
        working-directory: ui
        run: |
          # with a custom domain (ui/public/CNAME) the site sits at "/";
          # on the project URL it sits at "/<repo>/"
          if [ -f public/CNAME ]; then export BASE_PATH=/; else export BASE_PATH=/${{ github.event.repository.name }}/; fi
          npx vite build

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
